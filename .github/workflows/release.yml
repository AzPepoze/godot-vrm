name: "Release Build"

on:
     push:
          tags:
               - "v*"
     workflow_dispatch:

permissions:
     contents: write

jobs:
     build:
          name: Build (${{ matrix.platform }}, ${{ matrix.target }}, ${{ matrix.precision }})
          runs-on: ${{ matrix.os }}
          strategy:
               fail-fast: false
               matrix:
                    platform: [linux, windows, macos]
                    target: [template_debug, template_release]
                    precision: [single]
                    include:
                         - platform: linux
                           os: ubuntu-latest
                         - platform: windows
                           os: ubuntu-latest
                           scons-args: use_mingw=yes
                         - platform: macos
                           os: macos-latest

          steps:
               - name: Checkout
                 uses: actions/checkout@v4
                 with:
                      submodules: recursive

               - name: Setup Python
                 uses: actions/setup-python@v5
                 with:
                      python-version: "3.11"
                      cache: "pip"

               - name: Install Dependencies
                 run: |
                      if [ "${{ matrix.platform }}" = "linux" ]; then
                        sudo apt-get update -qq
                        sudo apt-get install -y build-essential
                      elif [ "${{ matrix.platform }}" = "windows" ]; then
                        sudo apt-get update -qq
                        sudo apt-get install -y mingw-w64
                      fi
                      pip install scons

               - name: Cache SCons
                 uses: actions/cache@v4
                 with:
                      path: |
                           ${{ github.workspace }}/.scons_cache/
                           ${{ github.workspace }}/godot-cpp/.scons_cache/
                      key: scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.precision }}-${{ hashFiles('**/SConstruct', 'godot-cpp/SConstruct') }}
                      restore-keys: |
                           scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.precision }}-

               - name: Build (${{ matrix.platform }})
                 run: |
                      export SCONS_CACHE=${{ github.workspace }}/.scons_cache/
                      scons platform=${{ matrix.platform }} target=${{ matrix.target }} precision=${{ matrix.precision }} ${{ matrix.scons-args }} -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

               - name: Upload artifact
                 uses: actions/upload-artifact@v4
                 with:
                      name: binary-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.precision }}
                      path: |
                           addons/vrm/bin/*.so
                           addons/vrm/bin/*.dll
                           addons/vrm/bin/*.framework
                      if-no-files-found: error

     publish:
          name: Package and Publish
          needs: build
          runs-on: ubuntu-latest
          steps:
               - name: Checkout
                 uses: actions/checkout@v4

               - name: Download artifacts
                 uses: actions/download-artifact@v4
                 with:
                      path: artifacts

               - name: Re-structure binaries
                 run: |
                      mkdir -p addons/vrm/bin
                      # Clean existing binaries to avoid confusion
                      rm -f addons/vrm/bin/*.so addons/vrm/bin/*.dll
                      rm -rf addons/vrm/bin/*.framework

                      # Find and move all binaries from artifact folders
                      find artifacts -name "*.so" -exec cp {} addons/vrm/bin/ \;
                      find artifacts -name "*.dll" -exec cp {} addons/vrm/bin/ \;
                      find artifacts -name "*.framework" -exec cp -r {} addons/vrm/bin/ \;

                      ls -R addons/vrm/bin/

               - name: Update plugin.cfg version
                 run: |
                      VERSION=${GITHUB_REF_NAME#v}
                      if [[ "$VERSION" != "workflow_dispatch" ]]; then
                        sed -i "s/version=\".*\"/version=\"$VERSION\"/" addons/vrm/plugin.cfg
                      fi

               - name: Package addon
                 run: |
                      # Create the zip with addons/vrm and addons/mtoon
                      zip -r godot-vrm-${{ github.ref_name }}.zip addons/ -x "*.import" -x "*.unwrap_cache"

               - name: Update Release
                 uses: softprops/action-gh-release@v2
                 with:
                      files: godot-vrm-${{ github.ref_name }}.zip
                      generate_release_notes: true
                      tag_name: ${{ github.ref_name }}
