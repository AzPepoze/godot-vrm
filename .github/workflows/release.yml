name: "Push to Asset Lib"

on:
  release:
    types: [published, prereleased]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            scons-args: platform=linux target=template_release
            artifact-path: addons/vrm/bin/libvrm_physics.linux.template_release.x86_64.so

          - platform: windows
            scons-args: platform=windows target=template_release use_mingw=yes
            artifact-path: addons/vrm/bin/libvrm_physics.windows.template_release.x86_64.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          [[ "${{ matrix.platform }}" == "windows" ]] && sudo apt-get install -y mingw-w64
          pip install scons

      - name: Build (${{ matrix.platform }})
        run: scons ${{ matrix.scons-args }} -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-binary
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish:
    name: Package and Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update plugin.cfg version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/version=\".*\"/version=\"$VERSION\"/" addons/vrm/plugin.cfg

      - name: Package addon
        run: |
          mkdir -p addons/vrm/bin
          find artifacts -name "*.so" -exec cp {} addons/vrm/bin/ \;
          find artifacts -name "*.dll" -exec cp {} addons/vrm/bin/ \;
          zip -r godot-vrm-${{ github.ref_name }}.zip addons/ -x "*.import" -x "*.unwrap_cache"

      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: godot-vrm-${{ github.ref_name }}.zip

      - name: Godot Asset Lib
        uses: deep-entertainment/godot-asset-lib-action@v0.4.0
        with:
          username: ${{ secrets.GODOT_ASSET_LIB_USER }}
          password: ${{ secrets.GODOT_ASSET_LIB_PASSWORD }}
          assetId: ${{ secrets.GODOT_ASSET_ID }}
          assetTemplate: ".asset-template.json.hb"
