name: CI

on:
     push:
          branches: [main]
     pull_request:
          branches: [main]

jobs:
     build:
          name: Build and Commit Binaries
          runs-on: ubuntu-latest
          permissions:
               contents: write
          steps:
               - name: Checkout
                 uses: actions/checkout@v4
                 with:
                      submodules: recursive
                      token: ${{ secrets.GITHUB_TOKEN }}

               - name: Setup Python
                 uses: actions/setup-python@v5
                 with:
                      python-version: "3.11"
                      cache: "pip"

               - name: Install Dependencies
                 run: |
                      sudo apt-get update -qq
                      sudo apt-get install -y mingw-w64
                      pip install scons

               - name: Build Linux
                 run: scons platform=linux target=template_release -j$(nproc)

               - name: Build Windows
                 run: scons platform=windows target=template_release use_mingw=yes -j$(nproc)

               - name: Commit and Push Binaries
                 run: |
                      git config --global user.name "github-actions[bot]"
                      git config --global user.email "github-actions[bot]@users.noreply.github.com"
                      git add addons/*/bin/*.template_release.*
                      if git diff --staged --quiet; then
                        echo "No changes in binaries."
                      else
                        git commit -m "chore: update latest binaries [skip ci]"
                        git push
                      fi
