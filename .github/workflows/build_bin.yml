name: "Build and Update Binaries"

on:
     push:
          branches:
               - main
     workflow_dispatch:

permissions:
     contents: write

jobs:
     build:
          name: Build (${{ matrix.platform }}, ${{ matrix.target }}, ${{ matrix.precision }})
          runs-on: ${{ matrix.os }}
          strategy:
               fail-fast: false
               matrix:
                    platform: [linux, windows, macos]
                    target: [template_debug, template_release]
                    precision: [single]
                    include:
                         - platform: linux
                           os: ubuntu-latest
                         - platform: windows
                           os: ubuntu-latest
                           scons-args: use_mingw=yes
                         - platform: macos
                           os: macos-latest

          steps:
               - name: Checkout
                 uses: actions/checkout@v4
                 with:
                      submodules: recursive

               - name: Setup Python
                 uses: actions/setup-python@v5
                 with:
                      python-version: "3.11"
                      cache: "pip"

               - name: Install Dependencies
                 run: |
                      if [ "${{ matrix.platform }}" = "linux" ]; then
                        sudo apt-get update -qq
                        sudo apt-get install -y build-essential
                      elif [ "${{ matrix.platform }}" = "windows" ]; then
                        sudo apt-get update -qq
                        sudo apt-get install -y mingw-w64
                      fi
                      pip install scons

               - name: Cache SCons
                 uses: actions/cache@v4
                 with:
                      path: |
                           ${{ github.workspace }}/.scons_cache/
                      key: scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.precision }}-${{ github.ref }}-${{ github.sha }}
                      restore-keys: |
                           scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.precision }}-${{ github.ref }}-
                           scons-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.precision }}-

               - name: Build (${{ matrix.platform }})
                 run: |
                      export SCONS_CACHE=${{ github.workspace }}/.scons_cache/
                      scons platform=${{ matrix.platform }} target=${{ matrix.target }} precision=${{ matrix.precision }} ${{ matrix.scons-args }} -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

               - name: Upload artifact
                 uses: actions/upload-artifact@v4
                 with:
                      name: binary-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.precision }}
                      path: |
                           addons/vrm/bin/*.so
                           addons/vrm/bin/*.dll
                           addons/vrm/bin/*.framework
                      if-no-files-found: error

     update:
          name: Commit and Update Branches
          needs: build
          runs-on: ubuntu-latest
          steps:
               - name: Checkout
                 uses: actions/checkout@v4
                 with:
                      fetch-depth: 0

               - name: Switch to main branch
                 run: git checkout -B main origin/main

               - name: Download artifacts
                 uses: actions/download-artifact@v4
                 with:
                      path: artifacts

               - name: Re-structure binaries
                 run: |
                      mkdir -p addons/vrm/bin
                      rm -f addons/vrm/bin/*.so addons/vrm/bin/*.dll
                      rm -rf addons/vrm/bin/*.framework
                      find artifacts -name "*.so" -exec cp {} addons/vrm/bin/ \;
                      find artifacts -name "*.dll" -exec cp {} addons/vrm/bin/ \;
                      find artifacts -name "*.framework" -exec cp -r {} addons/vrm/bin/ \;

               - name: Commit and Push Binaries
                 run: |
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      
                      git add addons/vrm/bin/
                      git commit -m "Auto-update compiled binaries [skip ci]" || echo "No changes"
                      git push origin main
                      
                      git subtree split -P addons/vrm -b vrm-split
                      git push -f origin vrm-split:vrm
                      git subtree split -P addons/mtoon -b mtoon-split
                      git push -f origin mtoon-split:mtoon
